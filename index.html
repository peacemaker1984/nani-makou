<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>なに巻こう</title>

<style>
:root{
  --bg:#f3efe4;
  --ink:#20251f;
  --muted:#6b7168;
  --panel:#fffdf7;
  --accent:#314b37;
  --accent2:#b87938;
  --line:#d8d1c3;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  background:var(--bg);
  color:var(--ink);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}

main{
  width:min(94vw,720px);
  min-height:100dvh;
  padding:22px 16px 28px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.kicker{
  font-size:.80rem;
  letter-spacing:.16em;
  color:var(--muted);
  line-height:1.5;
}

h1{
  font-size:clamp(2.4rem,8vw,4.6rem);
  margin:.03em 0 .25em;
  letter-spacing:.04em;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.tab{
  border:1px solid #9ba095;
  background:var(--panel);
  color:var(--ink);
  border-radius:999px;
  padding:8px 15px;
  font-weight:700;
  cursor:pointer;
}

.tab.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}


/* =========================
   スロット
   ========================= */

.slot-wrap{
  position:relative;
  width:min(92vw,560px);
  margin:0 auto;
}

.slot-window{
  position:relative;
  overflow:hidden;
  background:var(--panel);
  border:3px solid var(--accent);
  border-radius:18px;
  box-shadow:0 8px 18px #0002;
}

.slot-row{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 42px;
  border-bottom:1px solid var(--line);
  font-size:clamp(.95rem,3.5vw,1.25rem);
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#697068;
}

.slot-row:last-child{
  border-bottom:0;
}

.slot-row.center{
  height:60px;
  background:#eee3c8;
  color:var(--ink);
  font-size:clamp(1.15rem,4vw,1.55rem);
  font-weight:900;
}


/* 中央の選択マーカー */

.slot-pointer{
  position:absolute;
  top:50%;
  left:9px;
  transform:translateY(-50%);
  color:var(--accent2);
  font-size:1.8rem;
  font-weight:900;
  z-index:5;
}

.slot-pointer.right{
  left:auto;
  right:9px;
  transform:translateY(-50%) rotate(180deg);
}


/* 上下を少し暗く */

.slot-window::before,
.slot-window::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  height:46px;
  z-index:4;
  pointer-events:none;
}

.slot-window::before{
  top:0;
  background:linear-gradient(
    to bottom,
    rgba(243,239,228,.85),
    rgba(243,239,228,0)
  );
}

.slot-window::after{
  bottom:0;
  background:linear-gradient(
    to top,
    rgba(243,239,228,.85),
    rgba(243,239,228,0)
  );
}


/* =========================
   結果・ボタン
   ========================= */

.live{
  margin:10px auto 0;
  min-height:1.5em;
  font-size:.92rem;
  font-weight:700;
  color:var(--muted);
}

.result{
  min-height:2em;
  margin:5px auto 8px;
  font-weight:900;
  font-size:clamp(1.25rem,4.5vw,2rem);
}

#spin{
  border:0;
  border-radius:12px;
  padding:13px 38px;
  background:var(--accent2);
  color:#fff;
  font-size:1.22rem;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 4px 0 #7d4e20;
}

#spin:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #7d4e20;
}

#spin:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.note{
  margin-top:9px;
  color:var(--muted);
  font-size:.78rem;
}

.credit{
  margin-top:14px;
  font-size:.78rem;
  letter-spacing:.12em;
  color:var(--muted);
  font-weight:700;
}


/* =========================
   スマホ
   ========================= */

@media (max-width:600px){

  main{
    width:100%;
    min-height:100dvh;
    padding:8px 8px 10px;
    justify-content:flex-start;
  }

  .kicker{
    font-size:.68rem;
    line-height:1.35;
    letter-spacing:.11em;
  }

  h1{
    font-size:clamp(2.15rem,13vw,3.4rem);
    margin:0 0 .12em;
  }

  .tabs{
    gap:5px;
    margin-bottom:8px;
  }

  .tab{
    padding:6px 10px;
    font-size:.82rem;
  }

  .slot-wrap{
    width:96vw;
  }

  .slot-row{
    height:44px;
    padding:0 35px;
    font-size:.95rem;
  }

  .slot-row.center{
    height:52px;
    font-size:1.15rem;
  }

  .slot-pointer{
    font-size:1.4rem;
  }

  .live{
    margin-top:6px;
    font-size:.78rem;
  }

  .result{
    margin:3px auto 5px;
    min-height:1.8em;
    font-size:clamp(1.2rem,5.6vw,1.65rem);
  }

  #spin{
    width:min(84vw,340px);
    padding:11px 24px;
    font-size:1.1rem;
  }

  .note{
    margin-top:6px;
    font-size:.68rem;
  }

  .credit{
    margin-top:7px;
    font-size:.68rem;
  }
}


/* 高さの小さいスマホ */

@media (max-height:700px) and (max-width:600px){

  h1{
    font-size:2.5rem;
  }

  .slot-row{
    height:38px;
  }

  .slot-row.center{
    height:46px;
  }

  .tab{
    padding:5px 9px;
    font-size:.78rem;
  }

  .result{
    font-size:1.25rem;
  }

  #spin{
    padding:9px 22px;
  }

  .note{
    margin-top:4px;
  }

  .credit{
    margin-top:4px;
  }
}

</style>
</head>

<body>

<main>

  <div class="kicker">
    フライタイイング<br>
    フライ選択ルーレット
  </div>

  <h1>なに巻こう</h1>

  <div class="tabs" aria-label="カテゴリー">
    <button class="tab active" data-cat="all">全</button>
    <button class="tab" data-cat="dry">ドライ</button>
    <button class="tab" data-cat="nw">ニンフ、ウェット</button>
    <button class="tab" data-cat="bass">バス・ギル</button>
    <button class="tab" data-cat="salt">ソルト</button>
  </div>


  <div class="slot-wrap">

    <div class="slot-pointer">▶</div>
    <div class="slot-pointer right">▶</div>

    <div class="slot-window" id="slotWindow">

      <div class="slot-row" id="slot0"></div>
      <div class="slot-row" id="slot1"></div>
      <div class="slot-row center" id="slot2"></div>
      <div class="slot-row" id="slot3"></div>
      <div class="slot-row" id="slot4"></div>

    </div>

  </div>


  <div id="live" class="live">
    候補を選んで「巻くよ？」
  </div>

  <div id="result" class="result">
    さて、なに巻こう。
  </div>

  <button id="spin">
    巻くよ？
  </button>

  <div class="note">
    ボタンを押すと約3.5秒間回って、自動で止まります。
  </div>

  <div class="credit">
    平和製作所
  </div>

</main>


<script>

/* =========================
   フライ一覧
   ========================= */

const flies = {

 dry:[
 "エルクヘアカディス","アダムスパラシュート","DHBエルク","ロイヤルコーチマン",
 "アイカザイム","マシュマロピューパ","M&E","グリフィスナット","0ファイバーカディス",
 "ホットブラックカワゲラ","バックファイヤーダン","CDCダン","マシュマロクイーン",
 "ホットワックスブラックアント","アペタイザー","ホワイトウルフ",
 "ホットワックス・ギャップダン","ネバーシンクスケーター","DHBシケーダ",
 "ピーコックハールパラシュート","クロカワパラシュート","シナモンアント"
 ],

 nymph:[
 "O&P","G&P","ブラックナット","ゴールドリブドヘヤズイヤー","フェザントテールニンフ",
 "ヘアーズイヤー","パピーリーチ","ヘアラーバ","クロスオーストリッチ",
 "アグリーニンフ","マイクロエッグ"
 ],

 wet:[
 "マーチブラウン","マドラーミノー","ガバナー","アレキサンドラ",
 "ホスキンス","プロフェッサー","グリズリーキング","ウーリーバガー"
 ],

 bass:[
 "ブービーフライ","ヘアバグ","モンタナニンフ","マドラーミノー",
 "マウスガーグラー","シェニールワーム","ポップリップ","ザリガニゾンカー",
 "クリースフライ","発泡ヘッドダイバー","ビッチクリーク","モホーク",
 "ヘンハックルアダムス","フロッグ","バスマドラー","ポッピングミノー",
 "マダムX","キモゼミ","ドラワカ"
 ],

 salt:[
 "ラビットゾンカー","ラビットマツーカ","マラブーマツーカ",
 "マラブーハックルストリーマー","白の10番","イカフライ","エビフライ",
 "えさフライ","クラウザーミノー","レフティズデシーバー","バチガーグラー",
 "シュリンプ","スカッド","クレイジーチャーリー","ポッパーストリーマー"
 ]

};


/* =========================
   基本設定
   ========================= */

const rows=[
 document.getElementById("slot0"),
 document.getElementById("slot1"),
 document.getElementById("slot2"),
 document.getElementById("slot3"),
 document.getElementById("slot4")
];

const result=document.getElementById("result");
const spin=document.getElementById("spin");
const live=document.getElementById("live");

let category="all";
let spinning=false;
let currentIndex=0;


/* =========================
   カテゴリー
   ========================= */

function items(){

 if(category==="dry"){
   return flies.dry;
 }

 if(category==="nw"){
   return [...flies.nymph,...flies.wet];
 }

 if(category==="bass"){
   return flies.bass;
 }

 if(category==="salt"){
   return flies.salt;
 }

 return [
   ...flies.dry,
   ...flies.nymph,
   ...flies.wet,
   ...flies.bass,
   ...flies.salt
 ];

}


/* =========================
   スロット表示
   ========================= */

function renderSlot(index){

 const list=items();
 const n=list.length;

 for(let offset=-2;offset<=2;offset++){

   let i=(index+offset+n)%n;

   rows[offset+2].textContent=list[i];

 }

}


/* 縦に流れる感じを出す */

function animateRows(speed){

 rows.forEach(row=>{

   row.animate(

     [
       {
         transform:"translateY(-18px)",
         opacity:.35
       },
       {
         transform:"translateY(0)",
         opacity:1
       }
     ],

     {
       duration:Math.min(speed,220),
       easing:"ease-out"
     }

   );

 });

}


/* =========================
   カテゴリーボタン
   ========================= */

document.querySelectorAll(".tab").forEach(button=>{

 button.addEventListener("click",()=>{

   if(spinning){
     return;
   }

   document.querySelectorAll(".tab").forEach(x=>{
     x.classList.remove("active");
   });

   button.classList.add("active");

   category=button.dataset.cat;

   currentIndex=0;

   renderSlot(currentIndex);

   result.textContent="さて、なに巻こう。";

   live.textContent="候補を選んで「巻くよ？」";

 });

});


/* =========================
   スロット開始
   ========================= */

spin.addEventListener("click",()=>{

 if(spinning){
   return;
 }

 spinning=true;

 spin.disabled=true;

 result.textContent="選定中……";

 live.textContent="回転中";

 const list=items();

 const finalIndex=
   Math.floor(Math.random()*list.length);

 const startTime=performance.now();

 const duration=3500;


 function step(){

   const elapsed=
     performance.now()-startTime;

   const progress=
     Math.min(elapsed/duration,1);


   /* 最初は高速、最後はゆっくり */

   const delay=
     55 + Math.pow(progress,3)*420;


   currentIndex=
     (currentIndex+1)%list.length;


   renderSlot(currentIndex);

   animateRows(delay);


   if(progress<1){

     setTimeout(step,delay);

   }

   else{

     currentIndex=finalIndex;

     renderSlot(currentIndex);

     const winner=list[currentIndex];

     live.textContent="決定";

     result.textContent=
       "今日は「"+winner+"」！";

     spinning=false;

     spin.disabled=false;

   }

 }

 step();

});


/* 最初の表示 */

renderSlot(currentIndex);

</script>

</body>
</html>
